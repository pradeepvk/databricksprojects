# This is a Declarative Automation Bundle definition for github_bakehouseAnalystics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: github_bakehouseAnalystics
  uuid: fb670887-c134-4b8f-b524-62244dc22328

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e38c02ba-062e.cloud.databricks.com
    variables:
      catalog: github_bakehouse_analysitc_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-e38c02ba-062e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/vkpkumar@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/vkpkumar@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: github_bakehouse_analysitc_dev
      schema: rnd
    permissions:
      - user_name: vkpkumar@gmail.com
        level: CAN_MANAGE
