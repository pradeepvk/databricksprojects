# The main pipeline for github_bakehouseAnalystics

resources:
  pipelines:
    github_bakehouseAnalystics_etl:
      name: github_bakehouseAnalystics_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/github_bakehouseAnalystics_etl"

      libraries:
        - glob:
            include: ../src/github_bakehouseAnalystics_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
